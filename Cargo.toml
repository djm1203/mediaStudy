[package]
name = "the-librarian"
version = "0.1.0"
edition = "2024"
description = "The Librarian - Your personal AI study companion. Ingest PDFs, videos, and notes, then chat, quiz, and generate study materials."
license = "MIT"
repository = "https://github.com/djm1203/mediaStudy"
homepage = "https://github.com/djm1203/mediaStudy"
readme = "README.md"
keywords = ["rag", "study", "cli", "llm", "embeddings"]
categories = ["command-line-utilities", "text-processing"]
exclude = [".github/", "docs/", ".beacon/", "*.db"]

[[bin]]
name = "librarian"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Groq API
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF parsing
pdf-extract = "0.12"
lopdf = "0.44"

# Error handling
anyhow = "1"
thiserror = "2"

# Config and paths
dirs = "6"
toml = "1"

# Terminal styling
colored = "3"
indicatif = "0.18"
termimad = "0.35"

# Database
rusqlite = { version = "0.40", features = ["bundled", "modern_sqlite"] }

# Content-hash dedup for ingestion (B-019)
sha2 = "0.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Local embeddings (runs ONNX models)
fastembed = "5"
scraper = "0.27"
html2text = "0.17"
url = "2.5"

# Terminal UI (full-screen TUI — see docs/design/TUI_ARCHITECTURE.md)
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

[dev-dependencies]
# Hermetic per-test SQLite databases in a temp dir.
tempfile = "3"

[profile.release]
lto = true
strip = true
